name: Safe News Auto & Manual Crawler

on:
  # Cho phép bấm nút "Run workflow" thủ công bằng tay bất cứ lúc nào
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ chạy (production hoặc test)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - test

  # Hẹn giờ tự động chạy (Tùy chọn: Chạy 1 lần/ngày lúc 07:00 sáng giờ VN = 00:00 UTC)
  # Bạn có thể Disable/Enable workflow này bất kỳ lúc nào trên giao diện GitHub
  schedule:
    - cron: '0 0 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Crawler & AI Filter Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          MODE="${{ github.event.inputs.mode || 'production' }}"
          echo "Executing mode: $MODE"
          python main.py $MODE --save-logs

      - name: 💾 Commit & Push Crawl State (Chống trùng lặp bài báo cũ)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add crawl_state.json logs_prod/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update crawl state and logs [skip ci]" && git push)
